<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e13" />
  <title>Coffee Boss</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="styles.css?v=9" />
  <link rel="stylesheet" href="game-feel.css?v=9" />
  <link rel="stylesheet" href="feedback.css?v=9" />
  <link rel="stylesheet" href="shift-system.css?v=20" />
  <link rel="stylesheet" href="art.css?v=10" />
  <link rel="stylesheet" href="card-visuals.css?v=11" />
  <link rel="stylesheet" href="cinematic-ui.css?v=14" />
  <link rel="stylesheet" href="shop-world.css?v=20" />
  <link rel="stylesheet" href="ui-consistency.css?v=22" />
  <link rel="stylesheet" href="skill-radar.css?v=24" />
  <link rel="stylesheet" href="game-layout.css?v=26" />
</head>
<body>
  <div class="app-shell">
    <div class="body-grid game-layout">
      <aside class="sidebar game-rail" aria-label="Coffee Boss navigation">
        <button class="brand rail-brand" data-nav="home" aria-label="Coffee Boss home">
          <span class="brand-mark"><i data-lucide="coffee"></i></span>
          <span><strong>Coffee Boss</strong><small id="districtLabel">Old Market</small></span>
        </button>

        <nav class="rail-nav" aria-label="Main navigation">
          <button class="nav-item active" data-nav="home"><i data-lucide="house"></i><span>Shop</span></button>
          <button class="nav-item" data-nav="shifts"><i data-lucide="clipboard-list"></i><span>Shifts</span><b class="nav-badge" id="shiftBadge"></b></button>
          <button class="nav-item" data-nav="rivals"><i data-lucide="swords"></i><span>Rivals</span></button>
          <button class="nav-item" data-nav="locations"><i data-lucide="store"></i><span>Locations</span></button>
          <button class="nav-item" data-nav="stockroom"><i data-lucide="package-open"></i><span>Stockroom</span></button>
          <button class="nav-item" data-nav="crew"><i data-lucide="users"></i><span>Crew</span></button>
          <button class="nav-item" data-nav="challenges"><i data-lucide="trophy"></i><span>Challenges</span><b class="nav-badge" id="challengeBadge"></b></button>
          <button class="nav-item" data-nav="reserve"><i data-lucide="landmark"></i><span>Reserve</span></button>
          <button class="nav-item" data-nav="breakroom"><i data-lucide="heart-pulse"></i><span>Break Room</span></button>
          <button class="nav-item" data-nav="profile"><i data-lucide="circle-user-round"></i><span>Boss</span><b class="nav-badge" id="skillBadge"></b></button>
        </nav>

        <div class="rail-actions">
          <button class="rail-action" id="saveButton" title="Save game"><i data-lucide="save"></i><span>Save</span></button>
          <button class="rail-action" id="settingsButton" title="Game options"><i data-lucide="settings-2"></i><span>Options</span></button>
        </div>
      </aside>

      <section class="playfield">
        <section class="status-strip game-hud" aria-label="Player resources">
          <div class="status-item cash" id="cashHud"><i data-lucide="banknote"></i><span><small>Cash</small><strong id="cashStat">$0</strong></span></div>
          <div class="status-item morale" id="moraleHud"><i data-lucide="heart-pulse"></i><span><small>Morale</small><strong id="moraleStat">0/0</strong></span><div class="resource-meter"><span id="moraleBar"></span></div></div>
          <div class="status-item energy" id="energyHud"><i data-lucide="zap"></i><span><small>Energy</small><strong id="energyStat">0/0</strong></span><div class="resource-meter"><span id="energyBar"></span></div></div>
          <div class="status-item drive" id="driveHud"><i data-lucide="flame"></i><span><small>Drive</small><strong id="driveStat">0/0</strong></span><div class="resource-meter"><span id="driveBar"></span></div></div>
          <div class="status-item xp-status" id="xpHud"><i data-lucide="sparkles"></i><span><small>XP · Lv <b id="levelStat">1</b></small><strong id="xpStat">0 / 0</strong></span><div class="mini-progress"><span id="xpBar"></span></div></div>
        </section>

        <main id="main" class="main-content" tabindex="-1"></main>
      </section>
    </div>

    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button class="mobile-nav-item active" data-nav="home"><i data-lucide="house"></i><span>Shop</span></button>
      <button class="mobile-nav-item" data-nav="shifts"><i data-lucide="clipboard-list"></i><span>Shifts</span></button>
      <button class="mobile-nav-item" data-nav="rivals"><i data-lucide="swords"></i><span>Rivals</span></button>
      <button class="mobile-nav-item" data-nav="locations"><i data-lucide="store"></i><span>Locations</span></button>
      <button class="mobile-nav-item" data-nav="more"><i data-lucide="menu"></i><span>More</span></button>
    </nav>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="polite"></div>
  <dialog id="modal" class="modal"><div id="modalContent"></div></dialog>

  <script src="data.js?v=25"></script>
  <script src="engine.js?v=26"></script>
  <script src="art.js?v=10"></script>
  <script src="ui-main.js?v=14"></script>
  <script src="ui-business.js?v=9"></script>
  <script src="ui-gamefeel.js?v=26"></script>
  <script src="shift-system.js?v=26"></script>
  <script src="challenge-rules.js?v=27"></script>
  <script src="difficulty-balance.js?v=29"></script>
  <script src="art-integration.js?v=9"></script>
  <script src="ui-cinematic.js?v=27"></script>
  <script src="ui-actions.js?v=19"></script>
  <script src="workspace-scenes.js?v=18"></script>
  <script src="shop-world.js?v=26"></script>
  <script src="game-feedback.js?v=21"></script>
  <script src="result-reveal.js?v=27"></script>
  <script src="landing-mechanic.js?v=29"></script>
  <script src="app.js?v=26"></script>
</body>
</html>
